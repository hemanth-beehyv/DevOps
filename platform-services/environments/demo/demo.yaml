jenkins:
  kubeTargetVersionOverride: "1.35.2"
  fullnameOverride: "jenkins"
  namespaceOverride: "monitoring-stg"
  controller:
    jenkinsUriPrefix: "/jenkins"
    installPlugins:
      - kubernetes:4306.vc91e951ea_eb_d
      - workflow-aggregator:600.vb_57cdd26fdd7
      - git:5.7.0
      - configuration-as-code:1932.v75cb_b_f1b_698d
      - hashicorp-vault-plugin:371.v884a_4dd60fb_6
      - job-dsl:1.91
      - pipeline-utility-steps:2.19.0
      - github-oauth:651.v135e939e8b_60
    JCasC:
      configScripts:
        welcome-message: |
          jenkins:
            systemMessage: Welcome to hemantharjunagari jenkins CI\CD server. This Jenkins is configured and managed 'as code'.

          jobs:
            - script: >
                pipelineJob('MyJob') {
                  definition {
                    cps {
                      script("""
                        pipeline {
                          agent any
                          stages {
                            stage('Build') {
                              steps {
                                echo 'Building...'
                              }
                            }
                          }
                        }
                      """)
                      sandbox(true)
                    }
                  }
                }
    ingress:
      enabled: false
      hostName: "cluster.local.com"
      paths:
      - pathType: ImplementationSpecific
        backend:
          service:
            name: >-
              {{ template "jenkins.fullname" . }}
            port:
              number: 8080
        path: /jenkins
      apiVersion: "extensions/v1beta1"
      path: "/jenkins"
      pathType: "ImplementationSpecific"
      resourceRootUrl:
  additionalAgents:
    maven:
      podName: maven
      customJenkinsLabels: maven
      image:
        repository: maven
        tag: latest
